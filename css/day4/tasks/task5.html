<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Hide Example</title>
   <link rel="stylesheet" href="assest/css/task5.css">
</head>
<body>
  <h2>Card Examples</h2>

  <div class="card">Normal Card</div>

  <div class="card hidden-display">Hidden with display:none</div>

  <div class="card hidden-visibility">Hidden with visibility:hidden</div>

  <p>Notice: The second card disappears entirely, while the third card is invisible but still takes up space.</p>
</body>
</html>
