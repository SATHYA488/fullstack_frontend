<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position Comparison</title>
   <link rel="stylesheet" href="assets/css/task5.css">
</head>
<body>
  <h2>CSS Position Comparison</h2>
  <div class="container">
    <div class="box static">Static Position</div>
    <div class="box relative">Relative Position</div>
    <div class="box absolute">Absolute Position</div>
    <div class="box sticky">Sticky Position</div>
    <p style="margin-top:600px;">Scroll down to see Fixed Box stay in place.</p>
    <p style="margin-top:600px;">Keep scrolling to observe Sticky Box behavior.</p>
  </div>

  <div class="box fixed">Fixed Position</div>
</body>
</html>
