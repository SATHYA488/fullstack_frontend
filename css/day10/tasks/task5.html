<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Portfolio</title>
  <link rel="stylesheet" href="assets/css/task5.css">
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
  </header>

  <nav>
    <a href="#hero">Home</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>

  <section id="hero" class="hero">
    <img src="assets/image/download2.jpg" alt="Hero Image">
    <div class="hero-text">
      <h2>Welcome to My Portfolio</h2>
      <p>Showcasing my skills, projects, and contact information.</p>
    </div>
  </section>

  <section id="skills">
    <h2>Skills</h2>
    <p>HTML, CSS, JavaScript, React, Node.js</p>
  </section>

  <section id="projects">
    <h2>Projects</h2>
    <p>Project 1, Project 2, Project 3</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Email: myemail@example.com</p>
  </section>

  <footer>
    <p>&copy; 2026 My Portfolio</p>
  </footer>
</body>
</html>
