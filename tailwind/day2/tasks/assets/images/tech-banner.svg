<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="16"/>

  <!-- Network Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>

  <!-- Central Digital Earth Globe -->
  <g transform="translate(400, 225)">
    <!-- Outer Glow Orbit -->
    <circle r="120" fill="none" stroke="url(#blueCyan)" stroke-width="2" opacity="0.4" stroke-dasharray="8 6"/>
    <circle r="100" fill="url(#blueCyan)" opacity="0.15" filter="url(#glow)"/>
    <circle r="85" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

    <!-- Latitude / Longitude lines -->
    <ellipse rx="85" ry="40" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <ellipse rx="85" ry="75" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <ellipse rx="40" ry="85" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>

    <!-- Node Points -->
    <circle cx="-35" cy="-20" r="4" fill="#10b981"/>
    <circle cx="45" cy="-30" r="4" fill="#38bdf8"/>
    <circle cx="20" cy="40" r="4" fill="#f59e0b"/>
    <circle cx="-50" cy="35" r="4" fill="#ec4899"/>
  </g>

  <!-- Floating Tech Data Nodes -->
  <!-- Node 1: AI / Cloud -->
  <g transform="translate(160, 120)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="-5" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">CLOUD &amp; AI</text>
    <text x="0" y="14" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">AUTONOMOUS</text>
    <line x1="70" y1="0" x2="240" y2="105" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  </g>

  <!-- Node 2: Telehealth -->
  <g transform="translate(640, 120)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <text x="0" y="-5" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">HEALTHTECH</text>
    <text x="0" y="14" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">PRECISION AI</text>
    <line x1="-70" y1="0" x2="-240" y2="105" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  </g>

  <!-- Node 3: IoT Living -->
  <g transform="translate(160, 330)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="-5" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">SMART IOT</text>
    <text x="0" y="14" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">AUTOMATION</text>
    <line x1="70" y1="0" x2="240" y2="-105" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  </g>

  <!-- Node 4: Cybersecurity -->
  <g transform="translate(640, 330)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <text x="0" y="-5" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">CYBER ETHICS</text>
    <text x="0" y="14" fill="#f43f5e" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">ZERO TRUST</text>
    <line x1="-70" y1="0" x2="-240" y2="-105" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  </g>
</svg>
