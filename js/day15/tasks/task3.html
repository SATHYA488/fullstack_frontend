<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card with Show Details</title>
  <link rel="stylesheet" href="assets/css/task3.css">
</head>
<body>
  <div class="card">
    <img src="assets/image/image2.jpg" alt="Sample Image">
    <h2>Card Heading</h2>
    <div id="details" class="details">
      <p>
        This is the detailed information about the card. It is hidden initially and will appear when you click the button.
      </p>
    </div>
    <button id="toggleBtn">Show Details</button>
  </div>

<script src="assets/js/task3.js"></script>
</body>
</html>
