<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    input {
      margin: 5px;
      padding: 8px;
    }
    button {
      padding: 8px 12px;
      margin: 5px;
      cursor: pointer;
    }
   
  </style>
</head>
<body>
  <h2>Product Entry Form</h2>
  
  <form id="productForm">
    <input type="text" id="productName" placeholder="Product Name" required><br>
    <input type="number" id="price" placeholder="Price" required><br>
    <input type="text" id="category" placeholder="Category" required><br>
    <button id="addProduct">Add Product</button>
  </form>
  
  <h3>Product List:</h3>
  <div id="productList" class="product-list"></div>
  
  <script src="assets/js/task3.js"></script>
</body>
</html>
